<svg width="1800" height="1200" viewBox="0 0 1800 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .entity { fill: #ffffff; stroke: #172235; stroke-width: 2; }
      .header { fill: #172235; }
      .title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .field { font: 13px 'Segoe UI', Arial, sans-serif; fill: #18212f; }
      .note { font: 13px 'Segoe UI', Arial, sans-serif; fill: #485469; }
      .label { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f8b8d; }
      .line { stroke: #0f8b8d; stroke-width: 3; fill: none; }
      .legend { fill: #ffffff; stroke: #dfe5ec; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8b8d"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1800" height="1200"/>
  <text x="900" y="42" text-anchor="middle" style="font:700 30px 'Segoe UI', Arial, sans-serif; fill:#172235;">InvestSmart ERD</text>
  <text x="900" y="68" text-anchor="middle" class="note">Users are separated into Clients and Admins for a clearer academic 3-tier data model</text>

  <g transform="translate(80,120)">
    <rect class="entity" width="310" height="190" rx="8"/>
    <rect class="header" width="310" height="42" rx="8"/>
    <text class="title" x="155" y="27" text-anchor="middle">USERS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">email : VARCHAR(180) UK</text>
    <text class="field" x="18" y="116">password_hash : VARCHAR(255)</text>
    <text class="field" x="18" y="140">role : ENUM('client','admin')</text>
    <text class="field" x="18" y="164">status : ENUM('active','inactive')</text>
    <text class="field" x="18" y="188">created_at : TIMESTAMP</text>
  </g>

  <g transform="translate(80,410)">
    <rect class="entity" width="340" height="220" rx="8"/>
    <rect class="header" width="340" height="42" rx="8"/>
    <text class="title" x="170" y="27" text-anchor="middle">CLIENTS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">FK user_id : INT UK</text>
    <text class="field" x="18" y="116">full_name : VARCHAR(120)</text>
    <text class="field" x="18" y="140">surname : VARCHAR(120)</text>
    <text class="field" x="18" y="164">id_number : VARCHAR(20) UK</text>
    <text class="field" x="18" y="188">contact_info : VARCHAR(180)</text>
    <text class="field" x="18" y="212">created_at : TIMESTAMP</text>
  </g>

  <g transform="translate(460,410)">
    <rect class="entity" width="340" height="220" rx="8"/>
    <rect class="header" width="340" height="42" rx="8"/>
    <text class="title" x="170" y="27" text-anchor="middle">ADMINS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">FK user_id : INT UK</text>
    <text class="field" x="18" y="116">full_name : VARCHAR(120)</text>
    <text class="field" x="18" y="140">surname : VARCHAR(120)</text>
    <text class="field" x="18" y="164">employee_code : VARCHAR(40) UK</text>
    <text class="field" x="18" y="188">contact_info : VARCHAR(180)</text>
    <text class="field" x="18" y="212">created_at : TIMESTAMP</text>
  </g>

  <g transform="translate(80,760)">
    <rect class="entity" width="360" height="220" rx="8"/>
    <rect class="header" width="360" height="42" rx="8"/>
    <text class="title" x="180" y="27" text-anchor="middle">FINANCIAL_PROFILES</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">FK client_id : INT UK</text>
    <text class="field" x="18" y="116">gross_salary : DECIMAL(12,2)</text>
    <text class="field" x="18" y="140">deductions : DECIMAL(12,2)</text>
    <text class="field" x="18" y="164">monthly_expenses : DECIMAL(12,2)</text>
    <text class="field" x="18" y="188">current_savings : DECIMAL(12,2)</text>
    <text class="field" x="18" y="212">net_salary : DECIMAL(12,2)</text>
  </g>

  <g transform="translate(560,740)">
    <rect class="entity" width="520" height="320" rx="8"/>
    <rect class="header" width="520" height="42" rx="8"/>
    <text class="title" x="260" y="27" text-anchor="middle">INVESTMENT_PLANS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">FK client_id : INT</text>
    <text class="field" x="18" y="116">FK bank_id : INT</text>
    <text class="field" x="18" y="140">user_plan_name : VARCHAR(160)</text>
    <text class="field" x="18" y="164">investment_amount : DECIMAL(12,2)</text>
    <text class="field" x="18" y="188">monthly_contribution : TINYINT(1)</text>
    <text class="field" x="18" y="212">monthly_amount : DECIMAL(12,2)</text>
    <text class="field" x="18" y="236">investment_goal : VARCHAR(255)</text>
    <text class="field" x="18" y="260">risk/liquidity/horizon</text>
    <text class="field" x="18" y="284">expected_return : DECIMAL(5,2)</text>
    <text class="field" x="18" y="308">score : INT</text>
    <text class="field" x="18" y="332">bank_investment_url : VARCHAR(255)</text>
  </g>

  <g transform="translate(1160,130)">
    <rect class="entity" width="430" height="300" rx="8"/>
    <rect class="header" width="430" height="42" rx="8"/>
    <text class="title" x="215" y="27" text-anchor="middle">BANKS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">name : VARCHAR(160)</text>
    <text class="field" x="18" y="116">contact_info : VARCHAR(220)</text>
    <text class="field" x="18" y="140">website : VARCHAR(255)</text>
    <text class="field" x="18" y="164">plan_type : VARCHAR(80)</text>
    <text class="field" x="18" y="188">expected_return : DECIMAL(5,2)</text>
    <text class="field" x="18" y="212">risk / liquidity / horizon</text>
    <text class="field" x="18" y="236">allows_monthly : TINYINT(1)</text>
    <text class="field" x="18" y="260">details : TEXT</text>
    <text class="field" x="18" y="284">FK created_by_admin_id : INT</text>
  </g>

  <g transform="translate(1180,560)">
    <rect class="entity" width="420" height="250" rx="8"/>
    <rect class="header" width="420" height="42" rx="8"/>
    <text class="title" x="210" y="27" text-anchor="middle">ACTIVITY_LOGS</text>
    <text class="field" x="18" y="68">PK id : INT</text>
    <text class="field" x="18" y="92">FK user_id : INT</text>
    <text class="field" x="18" y="116">FK client_id : INT</text>
    <text class="field" x="18" y="140">FK admin_id : INT</text>
    <text class="field" x="18" y="164">action : VARCHAR(80)</text>
    <text class="field" x="18" y="188">entity_type / entity_id</text>
    <text class="field" x="18" y="212">description : VARCHAR(255)</text>
    <text class="field" x="18" y="236">created_at : TIMESTAMP</text>
  </g>

  <path class="line" d="M235 310 C235 360, 235 360, 250 410" marker-end="url(#arrow)"/>
  <text class="label" x="128" y="360">1 : 1 extends</text>

  <path class="line" d="M390 230 C455 230, 565 230, 630 410" marker-end="url(#arrow)"/>
  <text class="label" x="470" y="250">1 : 1 extends</text>

  <path class="line" d="M250 630 C250 700, 250 700, 260 760" marker-end="url(#arrow)"/>
  <text class="label" x="145" y="705">1 : 1 has</text>

  <path class="line" d="M420 520 C510 520, 560 790, 560 840" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="600">1 : many saves</text>

  <path class="line" d="M800 520 C1100 520, 1130 300, 1160 300" marker-end="url(#arrow)"/>
  <text class="label" x="920" y="500">1 : many creates</text>

  <path class="line" d="M1080 900 C1160 900, 1160 320, 1160 320" marker-end="url(#arrow)"/>
  <text class="label" x="1090" y="870">many : 1 bank</text>

  <path class="line" d="M390 210 C1040 210, 1040 650, 1180 650" marker-end="url(#arrow)"/>
  <text class="label" x="915" y="195">1 : many authenticates</text>

  <path class="line" d="M420 560 C950 560, 1080 700, 1180 700" marker-end="url(#arrow)"/>
  <text class="label" x="920" y="545">1 : many performs</text>

  <path class="line" d="M800 560 C1010 560, 1070 740, 1180 740" marker-end="url(#arrow)"/>
  <text class="label" x="995" y="586">1 : many performs</text>

  <rect class="legend" x="80" y="1040" width="680" height="110" rx="8"/>
  <text x="100" y="1070" style="font:700 16px 'Segoe UI', Arial, sans-serif; fill:#172235;">Design Notes</text>
  <text class="note" x="100" y="1098">- USERS stores authentication only.</text>
  <text class="note" x="100" y="1118">- CLIENTS stores identity and drives financial profiles and investment plans.</text>
  <text class="note" x="100" y="1138">- ADMINS stores administrator identity and bank management responsibility.</text>
</svg>
